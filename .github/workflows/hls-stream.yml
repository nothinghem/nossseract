name: "6-Hour HLS to RTMP Stream (Auto Restart)"

on:
  schedule:
      - cron: "55 */5 * * *" 
  workflow_dispatch:  # Manual trigger
  push:               # Auto trigger when commit happens
    branches:
      - main

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install ffmpeg python3 wget git -y
          wget -O logo.png "https://i.ibb.co/sdHxr15r/CURSED-STREAM-1.png"

      - name: Start Stream
        run: |
          python3 - <<'EOF'
          import subprocess, time

          STREAM_INPUT = "https://api.sportsbite.xyz/hls/267.m3u8"
          RTMP_OUTPUT = "rtmp://bangalore.restream.io/live/re_5437878_evente68e028ddf3945ac8589d7b000962f09"

          def start_stream():
            headers = (
                "Origin: https://sportsbite.xyz\r\n"
                "Referer: https://sportsbite.xyz/\r\n"
            )
        
            return subprocess.Popen([
                "ffmpeg",
                "-re",
                "-headers", headers,
                "-user_agent", "Mozilla/5.0",
                "-i", STREAM_INPUT,
        
                "-i", "logo.png",
                "-filter_complex", "overlay=10:10",
        
                "-vcodec", "libx264",
                "-vprofile", "baseline",
                "-g", "30",
        
                "-acodec", "aac",
                "-f", "flv",
                RTMP_OUTPUT
            ])


          process = start_stream()
          while True:
              time.sleep(30)
              if process.poll() is not None:
                  print("Stream stopped! Restarting FFmpeg...")
                  process = start_stream()
          EOF

      - name: Auto-restart (commit to trigger again)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          echo "Restarted: $(date)" > last_run.txt
          git add last_run.txt
          git commit -m "Auto-restart stream $(date)" || echo "No changes to commit"
          git push
          
